name: CI

# Runs automatically on push/PR to main (the dev unit tests the supervisor
# requires), plus manual dispatch. The github.repository guard on every job keeps
# it inert on the private lab upstream, so only the engkinandatama fork spends
# Actions minutes. Path filters are kept because minutes are metered (2,000/month
# on the Free plan, billed per job, rounded up); they cover exactly the trees the
# tests and DAG check assert on (config/** included -- commit 38a99fd was
# config-only and otherwise ran no checks). The list is duplicated under push and
# pull_request because GitHub Actions rejects YAML anchors.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'rules/**'
      - 'tests/**'
      - 'config/**'
      - 'envs/**'
      - 'docs/**'
      - 'requirements/**'
      - 'Snakefile'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'rules/**'
      - 'tests/**'
      - 'config/**'
      - 'envs/**'
      - 'docs/**'
      - 'requirements/**'
      - 'Snakefile'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '.github/workflows/ci.yml'

# The commit cadence here runs to thirty-plus pushes on an active day, so
# superseding runs matters more than finishing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Cheapest job, kept separate and first. The most frequent failure -- a config
  # threshold that drifted -- then reports in well under a minute instead of
  # waiting behind the scientific dependency install.
  contract:
    # Dormant on the upstream lab repository (lab-biotek-bio-ugm/pandemic_prep_idn):
    # a workflow running there would spend the LAB's Actions quota, including for
    # pull requests, which bill to the base repository. Keeping the file present
    # but inert lets the lab switch CI on for itself. GitHub Actions has no
    # workflow-level `if`, so this has to be repeated on each job.
    if: github.repository == 'engkinandatama/pandemic-preparedness'
    name: Contracts and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Single version: this is the fast fail-first gate. Cross-version
          # coverage lives on the `test` job below, which runs the real suite.
          python-version: '3.10'

      - name: Install
        run: pip install pytest pyyaml ruff==0.16.0

      # Replaces the hand-rolled `pyflakes | grep "undefined name" | grep -v
      # "'snakemake'"` shell step this workflow used to carry. F821 is the rule
      # that matters: a NameError inside main() survives compileall and every
      # import-based test, then dies on the cluster part-way through a HyPhy run.
      # `builtins = ["snakemake"]` in pyproject.toml handles the global that
      # Snakemake injects into script:-directive scripts.
      - name: Lint
        run: ruff check --output-format=github .

      # Selected by PATH, not by `-m contract`. Marker deselection happens after
      # collection, and collecting tests/ imports pipeline scripts that need
      # pandas, Biopython and primer3 -- scripts/export_supplementary.py even
      # calls sys.exit(1) on ImportError, which crashes collection outright.
      # Path selection is what keeps this job's dependency list to two packages.
      - name: Config contracts
        run: pytest tests/contracts/

  test:
    if: github.repository == 'engkinandatama/pandemic-preparedness'
    name: Test suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The real cross-version guard: the whole suite on three interpreters --
      # 3.10 (the deployment floor that envs/*.yaml pin and the HPC runs), 3.12
      # (mid), and 3.14 (newest stable). All three are verified green, and every
      # compiled dependency (numpy, pandas, biopython, primer3-py) ships wheels
      # for all three, so no build-from-source in CI. Trim to two if Actions
      # minutes get tight; the deployment floor 3.10 must always stay.
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install
        run: pip install -r requirements/ci.txt

      - name: Run tests
        run: pytest --durations=10

  dag:
    if: github.repository == 'engkinandatama/pandemic-preparedness'
    name: DAG validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Snakemake 8+/9+ requires Python >=3.11, so the DAG job cannot use the
          # 3.10 deployment floor. This only sets the interpreter that parses the
          # workflow graph; the pipeline's runtime Python (envs/*.yaml) is separate.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dag.txt

      - name: Install
        run: pip install -r requirements/dag.txt

      - name: Byte-compile every script
        run: python -m compileall -q scripts

      # One job with a loop rather than a seven-leg matrix. Each leg would pay
      # its own checkout and Snakemake install and be billed as a whole minute,
      # while the dry runs themselves take seconds.
      #
      # Each config is invoked exactly as a user invokes it, merge and all. The
      # holes that the merge hides -- a key present in one config and absent in
      # another -- are the job of tests/contracts/, which reads each file
      # standalone. Trying to catch them here with --replace-workflow-config
      # would report green on configs that are overlays by design, because the
      # missing keys would resolve to None and still build a DAG.
      - name: Snakemake dry-run for every pathogen config
        run: |
          set -uo pipefail
          failed=0
          for cfg in config/config*.yaml; do
            echo "::group::${cfg}"
            out=$(snakemake --dry-run --quiet --configfile "${cfg}" 2>&1) || true
            echo "${out}"
            echo "::endgroup::"

            # A positive assertion. The previous version of this step ended in a
            # bare `exit 0`, so an empty output, a failed install, or an
            # exception class nobody had thought of all reported green.
            if ! echo "${out}" | grep -q "Building DAG of jobs"; then
              echo "::error file=${cfg}::Snakemake never reached DAG construction"
              failed=1
              continue
            fi

            # MissingInputException is expected and tolerated: no raw sequence
            # data is committed, so every config is missing its cohort here.
            # Everything listed below means the rules or the config are wrong.
            if echo "${out}" | grep -qE "WildcardError|SyntaxError|RuleException|KeyError|TypeError|AttributeError|AmbiguousRuleException|IncompleteCheckpointException"; then
              echo "::error file=${cfg}::rule or config error during DAG build"
              failed=1
            fi
          done
          exit "${failed}"
