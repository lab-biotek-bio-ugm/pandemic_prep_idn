name: Unit Tests & DAG Validation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'rules/**'
      - 'tests/**'
      - 'Snakefile'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'rules/**'
      - 'tests/**'
      - 'Snakefile'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # Runs only on the fork that owns this CI. The upstream lab repository
    # (lab-biotek-bio-ugm/pandemic_prep_idn) is private, so any workflow running there
    # spends the LAB's Actions quota -- including runs triggered by pull requests, which
    # are billed to the base repository rather than the fork. Keeping the file present
    # but dormant means the lab decides for itself whether to switch CI on; change or
    # drop this condition to enable it.
    if: github.repository == 'engkinandatama/pandemic-preparedness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Core scientific deps exercised by the unit tests.
          pip install pytest numpy pandas biopython pyyaml primer3-py openpyxl pyflakes

      - name: Undefined-name check
        # compileall (below, in dag-validation) only catches syntax errors. A
        # NameError inside main() passes every import-based test and then fails on
        # the cluster; one shipped that way and cost a 15-minute HyPhy run.
        # 'snakemake' is injected as a global by the script: directive.
        run: |
          out=$(python -m pyflakes scripts/*.py scripts/tools/*.py || true)
          echo "$out"
          if echo "$out" | grep "undefined name" | grep -v "'snakemake'"; then
            echo "::error::undefined name in a pipeline script"
            exit 1
          fi

      - name: Run unit tests
        run: pytest -q

  dag-validation:
    if: github.repository == 'engkinandatama/pandemic-preparedness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Snakemake
        run: |
          python -m pip install --upgrade pip
          pip install snakemake pyyaml

      - name: Compile all Python scripts
        run: python -m compileall -q scripts

      - name: Snakemake dry-run (DAG build)
        # Builds the DAG for every rule; catches wildcard/rule-definition errors
        # (e.g. the M11 input-only wildcard bug) without needing real input data.
        # A MissingInputException is expected in CI (no raw sequences committed) and
        # is tolerated; rule-definition errors are not.
        run: |
          set +e
          out=$(snakemake -n 2>&1)
          echo "$out"
          if echo "$out" | grep -qE "WildcardError|SyntaxError|RuleException|IncompleteCheckpointException|AmbiguousRuleException"; then
            echo "::error::Snakemake rule-definition error detected in dry-run"
            exit 1
          fi
          exit 0
