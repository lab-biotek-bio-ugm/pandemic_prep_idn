name: Unit Tests & DAG Validation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'rules/**'
      - 'tests/**'
      - 'Snakefile'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'rules/**'
      - 'tests/**'
      - 'Snakefile'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Core scientific deps exercised by the unit tests.
          pip install pytest numpy pandas biopython pyyaml primer3-py openpyxl

      - name: Run unit tests
        run: pytest -q

  dag-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Snakemake
        run: |
          python -m pip install --upgrade pip
          pip install snakemake pyyaml

      - name: Compile all Python scripts
        run: python -m compileall -q scripts

      - name: Snakemake dry-run (DAG build)
        # Builds the DAG for every rule; catches wildcard/rule-definition errors
        # (e.g. the M11 input-only wildcard bug) without needing real input data.
        # A MissingInputException is expected in CI (no raw sequences committed) and
        # is tolerated; rule-definition errors are not.
        run: |
          set +e
          out=$(snakemake -n 2>&1)
          echo "$out"
          if echo "$out" | grep -qE "WildcardError|SyntaxError|RuleException|IncompleteCheckpointException|AmbiguousRuleException"; then
            echo "::error::Snakemake rule-definition error detected in dry-run"
            exit 1
          fi
          exit 0
