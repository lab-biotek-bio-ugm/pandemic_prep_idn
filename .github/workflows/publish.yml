name: Render and Deploy Quarto Report to Cloudflare Pages

on:
  push:
    branches:
      - main
      - report
    paths:
      - 'report/**'
      - '.github/workflows/publish.yml'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    # See the note in tests.yml: dormant on the upstream lab repository, which
    # would otherwise spend the lab's quota AND publish to their cf-pages branch.
    if: github.repository == 'engkinandatama/pandemic-preparedness'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Report
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: report

      - name: Deploy to cf-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: cf-pages
          publish_dir: report/_site
          exclude_assets: ''
