name: Render and Deploy Quarto Report to Cloudflare Pages

# Manual trigger only ("Run workflow" in the Actions tab, or
# `gh workflow run publish.yml`). It does NOT auto-deploy on push. Because it only
# ever runs when a human dispatches it, there is no repository guard: it renders
# and deploys from whichever repo it is triggered in (the one whose cf-pages
# branch feeds the live site). To automate on push later, uncomment the block below.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #     - report
  #   paths:
  #     - 'report/**'
  #     - '.github/workflows/publish.yml'

# `contents: write` is what peaceiris/actions-gh-pages needs to push the
# rendered site to the cf-pages branch. The GitHub Pages deployment API is not
# used here -- Cloudflare builds from that branch -- so `pages: write` and
# `id-token: write` granted rights this workflow never exercised.
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Report
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: report

      - name: Deploy to cf-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: cf-pages
          publish_dir: report/_site
          exclude_assets: ''
