# Pandemic Preparedness Diagnostic Pipeline — Configuration Profile
# Target: Influenza A (Universal) - NP Segment
---

# [GLOBAL] Pipeline Metadata
# --- GLOBAL PARAMETERS ---
global_params:
  min_subtype_count: 30
  iupac_threshold: 0.15

build_name: "influenza-a-np-universal"
database: "local"

references:
  reference_id: "NC_002019.1"
  genome: "config/references/flu_a_np_reference.fasta"
  annotation: "config/references/flu_a_np_annotation.gff"

# [M01] Data Acquisition
local_input:
  sequences: "dataset/EpiFlu/NP/EpiFlu_A_NP_Combined_Sequence.fasta"
  metadata: "dataset/EpiFlu/NP/EpiFlu_A_NP_Combined_Metadata.csv"
  format: "gisaid_epiflu"

# [M01a] Early Filtering (Pre-Nextclade)
early_filter:
  enabled: true
  query: null                     
  min_date: "2016-01-01"          # Mempertahankan min_date dari NP config asli
  max_date: "2026-04-01"

# [M02] Quality Control & Spatio-Temporal Filter
qc:
  max_n_content: 5.0              
  dedup: true                     

subsampling:
  # Pengaturan Dasar (digunakan jika focal dimatikan)
  group_by: "subtype country year month"
  sequences_per_group: 10
  max_sequences: null
  min_length: 1200                # Disetel 1200 untuk panjang segmen NP
  seed: 42
  query: "country in ['Indonesia', 'Singapore', 'Malaysia', 'Thailand', 'Vietnam', 'Philippines', 'Myanmar', 'Cambodia', 'Laos', 'Brunei']"
  
  focal:
    enabled: false
    query: "country == 'Indonesia'"
    max_sequences: null
    sequences_per_group: 50
    group_by: "subtype year month"
    
  contextual:
    query: "country != 'Indonesia'"
    max_sequences: null
    sequences_per_group: 3
    group_by: "subtype country year month"

# [M03] Sequence Alignment
# Menggunakan Augur Align dengan parameter GLOBAL references

# [M04] Phylogenetic Inference (Tree Builder)
augur:
  threads: 16

timetree:
  clock_rate: 0.003
  clock_std_dev: 0.0015

# [M05] Evolutionary Selection Pressure (HyPhy)
hyphy:
  threads: 8          # Mengikuti MP: 8 sudah cukup optimal
  p_value_threshold: 0.1
  methods:
    - "FUBAR"
    - "MEME"
  target_genes:
    - "ALL"
  subsample:
    enabled: true
    max_sequences: 2000          
    min_sequences: 50
    strategy: "balanced"
    group_by:
      subtype: true               
      country: true
      year: true
    seed: 42

# [M06] Annotation & Clade Assignment
nextclade:
  enabled: false
  dataset_name: null              # Tidak ada dataset resmi dari Nextstrain untuk NP, jadi Nextclade dimatikan

# [M07] Diagnostic Bridge Builder
bridge:
  strategy: "full_segment"       
  window_size: 300               
  min_region_length: 150
  overlap_threshold: 0.75
  buffer_bp: 50
  entropy_threshold: 0.020    
  gard_buffer_bp: 50
  include_utr: true
  design_regions:
    - "segment-NP"
  scoring:
    core:
      conservation_weight: 0.66
      purifying_weight: 0.34
    multipliers:
      meme:
        thresholds:
          - max_sites: 0
            multiplier: 1.0
          - max_sites: 1
            multiplier: 0.9
          - max_sites: 3
            multiplier: 0.7
        veto_above: 3
      recombination:
        near_penalty: 0.5
      gc_content:
        ideal_min: 35
        ideal_max: 60
        marginal_ranges:
          - min: 25
            max: 34
          - min: 61
            max: 70
        marginal_multiplier: 0.7
        veto_below: 25
        veto_above: 70
      conserved_block:
        entropy_threshold: 0.10
        ideal_min_len: 35
        penalty_min_len: 20
        penalty_multiplier: 0.8
      homopolymer:
        max_repeats: 5
        penalty_multiplier: 0.6
  tiers:
    strict:                   
      min_conservation: 0.95
      min_purifying_prob: 0.9
    moderate:                 
      min_conservation: 0.85
      min_purifying_prob: 0.7
    survival:                 
      min_conservation: 0.80

# [M08] Clade SNP Finder (Discriminative Genotyping)
snp_finder:
  enabled: true
  overlap_threshold: 0.75        
  buffer_bp: 150                 
  gard_buffer_bp: 50             
  min_fixation_freq: 0.90        
  min_coverage: 0.80             
  p_value_threshold: 0.01        
  group_by: "subtype"            

# [M09] PrimerLab Integration
primerlab:
  repo_path: "git+https://github.com/CORE-Lab-Research/primerlab-genomic.git@main" 
  template: "config/primerlab_template.yaml"
  design:
    num_candidates: 1000
    search_strategy: "standard"
    hard_qc_filter: "false"
    max_search_iterations: 5
    vienna_ranking_limit: 500
    window_size: null
    overlap: 200
    validate: true                
    blast_offtarget_check: false  
    blast_ranking_limit: 10
    blast_database: "nt"
    blast_mode: "remote"          
    blast_local_db_path: null     
    blast_targeted_check: false   
    blast_targeted_db_path: null  
    entropy_threshold: 0.50       
    min_exclusion_block_length: 10 
    degenerate:
      enabled: true                  
      maf_threshold: 0.10            
      max_multiplier: 16             
      thermo_eval_mode: "worst_case" 
      vienna_temp: 37.0              
      target_coverage_increase: 0.05 

# [M10] BLAST Specificity Verification
blast_verification:
  enabled: true
  num_candidates: 100              
  mode: "local"                  
  database: "custom_respiratory_db"
  local_db_path: "resources/blast_db" 
  qcov_hsp_perc: 60              
  min_coverage_percent: 30.0     
  three_prime_critical_bp: 8     
  custom_db_build:
    enabled: true
    output_dir: "resources/blast_db"  
    max_seqs_per_taxon: 500            
    seq_length_min: 500                
    cleanup_intermediates: true        
    hosts:
      - name: "GRCh38"
        fasta_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/001/405/GCF_000001405.40_GRCh38.p14/GCF_000001405.40_GRCh38.p14_genomic.fna.gz"
        enabled: false
      - name: "T2T_CHM13"
        fasta_url: "https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/009/914/755/GCF_009914755.1_T2T-CHM13v2.0/GCF_009914755.1_T2T-CHM13v2.0_genomic.fna.gz"
        enabled: true
    virus_taxons:
      - name: "Influenza A virus"
        taxid: 11320        
      - name: "Influenza B virus"
        taxid: 11520        
      - name: "Influenza C virus"
        taxid: 11552
      - name: "Human orthopneumovirus"           
        taxid: 11250
      - name: "SARS-CoV-2"
        taxid: 2697049
      - name: "Human adenovirus"
        taxid: 10535
      - name: "Human rhinovirus"
        taxid: 12110
      - name: "Human enterovirus"
        taxid: 138948
      - name: "Human parainfluenza virus 1"
        taxid: 12730
      - name: "Human parainfluenza virus 2"
        taxid: 11225
      - name: "Human parainfluenza virus 3"
        taxid: 11234
      - name: "Human parainfluenza virus 4"
        taxid: 11246
      - name: "Human metapneumovirus"
        taxid: 162145

# [M11] In-silico PCR Coverage Analysis
insilico_pcr:
  enabled: true
  max_mismatch: 3             
  num_candidates: 20          
  min_subtype_seqs: 30        
  raa_3prime_bp: 8            
  raa_max_3prime_mm: 1        
  raa_max_internal_mm: 4      
