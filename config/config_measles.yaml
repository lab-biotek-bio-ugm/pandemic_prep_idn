# Pandemic Preparedness Diagnostic Pipeline — Configuration Profile
# Target: Measles Virus (NCBI Dataset) - Indonesia & Global Surveillance
---

# [GLOBAL] Pipeline Metadata & Thresholds
global_params:
  min_subtype_count: 30           # Minimum sequences per genotype/lineage
  iupac_threshold: 0.15           # Minor allele frequency to trigger IUPAC encoding (15%)

# --- PIPELINE CONFIGURATION ---
build_name: "measles-indo-only"
database: "local"

references:
  reference_id: "NC_001498.1"
  genome: "config/references/measles_reference.fasta"
  annotation: "config/references/measles_annotation.gff"

# [M01] Data Acquisition (Local Input from NCBI Dataset)
local_input:
  sequences: "dataset/NCBI/Measles/sequences_clean.fasta"
  metadata: "dataset/NCBI/Measles/metadata_clean.tsv"
  format: "tsv"

# [M01a] Early Filtering
early_filter:
  enabled: false
  query: null
  min_date: null
  max_date: null

# [M02] Quality Control & Spatio-Temporal Filter
qc:
  max_n_content: 5.0              # Toleransi maksimal % base N (ambiguitas)
  dedup: true                     # Hapus sekuens duplikat identik

subsampling:
  # Pengaturan Dasar (Indonesia Only)
  group_by: "genotype country year month"
  sequences_per_group: 50
  max_sequences: null
  min_length: 400
  seed: 42
  query: "country == 'Indonesia'"

  # Targeted Background Subsampling (Focal vs Contextual)
  focal:
    enabled: false
    query: "country == 'Indonesia'"
    max_sequences: null
    sequences_per_group: 50
    group_by: "genotype year month"
    
  contextual:
    enabled: false
    query: "country != 'Indonesia'"
    max_sequences: null
    sequences_per_group: 3
    group_by: "genotype country year month"

# [M03] Sequence Alignment (MAFFT)
alignment:
  method: "mafft"
  args: "--auto"

# [M04] Phylogenetic Inference & Timetree (IQ-TREE2 & TreeTime)
augur:
  threads: 16

timetree:
  clock_rate: 0.0006              # Measles rate (~6e-4 subs/site/year)
  clock_std_dev: 0.0002

# [M05] Evolutionary Selection Pressure (HyPhy)
hyphy:
  threads: 8
  p_value_threshold: 0.1   # MEME episodic-selection significance, consumed by M07 when
                           # counting "danger sites" in a candidate region.
                           # JUSTIFIKASI: hyphy.org merekomendasikan p <= 0.1 untuk MEME
                           # (sengaja lebih longgar dari 0.05 konvensional, karena MEME
                           # bersifat konservatif pada alignment kecil). FUBAR memakai
                           # posterior probability, bukan p-value — ambangnya >= 0.9,
                           # lihat bridge.tiers.*.min_purifying_prob.
                           # CATATAN: sampai revisi ini nilai ini TIDAK PERNAH DIBACA;
                           # M07 memakai 0.05 yang di-hardcode.
  methods:
    - "FUBAR"
    - "MEME"
  target_genes:
    - "N"                         # Nucleoprotein gene
  subsample:
    enabled: true
    max_sequences: 2000
    min_sequences: 50
    strategy: "balanced"
    group_by:
      genotype: true
      country: true
      year: true
    seed: 42

# [M06] Annotation & Clade Assignment
nextclade:
  enabled: false
  dataset_name: null

# [M07] Bridge Scoring Engine
bridge:
  strategy: "full_segment"
  window_size: 300
  min_region_length: 150
  overlap_threshold: 0.75
  buffer_bp: 50
  entropy_threshold: 0.20
  gard_buffer_bp: 50
  include_utr: true
  design_regions:
    - "segment-N"
  scoring:
    # CATATAN: blok `core` dengan conservation_weight/purifying_weight SUDAH DIHAPUS.
    # Dulu: core = 0.66*C + 0.34*P, lalu dikali multiplier.
    # Masalahnya bentuk aditif membuat bukti seleksi bisa MENGGANTIKAN konservasi:
    # rentang penuh term P mampu membalik kesenjangan konservasi 25.8 poin persen,
    # yaitu memilih situs MAF ~14.5% di atas situs yang konservasinya sempurna.
    # Primer tidak bisa menukar mismatch hari ini dengan bukti kendala evolusi.
    # Sekarang core = C saja, dan durabilitas jadi multiplier di bawah.
    multipliers:
      meme:
        thresholds:
          - max_sites: 0
            multiplier: 1.0
          - max_sites: 1
            multiplier: 0.9
          - max_sites: 3
            multiplier: 0.7
        veto_above: 3
      # Diskon berdasarkan LAJU PERGANTIAN NUKLEOTIDA, bukan dN/dS.
      # FUBAR melaporkan alpha (laju sinonim) dan beta (laju non-sinonim) per kodon.
      # Prob[alpha>beta] -- yang dipakai sebelumnya -- mengukur kendala di tingkat
      # PROTEIN. Primer tidak membaca protein: di bawah seleksi purifying kuat,
      # posisi kodon ke-3 (wobble) tetap bebas berubah, jadi sebuah situs bisa
      # punya Prob[alpha>beta] tinggi tapi nukleotidanya berputar cepat -- persis
      # kasus yang membuat primer cepat tidak berguna.
      #
      # rel_rate = (rata-rata laju substitusi region) / (median laju gen tsb).
      # Self-calibrating, karena laju FUBAR relatif terhadap skala alignment sendiri.
      #
      # floor: satu-satunya parameter bebas, dan bacaannya langsung -- rentang penuh
      # multiplier hanya boleh membalik kesenjangan konservasi sebesar (1 - floor).
      # 0.95 => 5 poin persen, kira-kira selisih MAF 0% vs 1.6%.
      durability:
        floor: 0.95        # diskon maksimum saat pergantian nukleotida sangat cepat
        rate_cap: 3.0      # rel_rate di atas ini langsung kena floor (3x median gen)
        no_evidence: 0.95  # tidak ada data FUBAR (non-coding / gen tak dianalisis)
      recombination:
        near_penalty: 0.5
      gc_content:
        ideal_min: 35
        ideal_max: 60
        marginal_ranges:
          - min: 25
            max: 34
          - min: 61
            max: 70
        marginal_multiplier: 0.7
        veto_below: 25
        veto_above: 70
      conserved_block:
        entropy_threshold: 0.10
        ideal_min_len: 35
        penalty_min_len: 20
        penalty_multiplier: 0.8
      homopolymer:
        max_repeats: 5
        penalty_multiplier: 0.6
  tiers:
    strict:
      min_conservation: 0.95
      min_purifying_prob: 0.9
    moderate:
      min_conservation: 0.85
      min_purifying_prob: 0.7
    survival:
      min_conservation: 0.80

# [M07a] Clade SNP Finder
snp_finder:
  enabled: true
  overlap_threshold: 0.75
  buffer_bp: 150
  gard_buffer_bp: 50
  min_fixation_freq: 0.90
  min_coverage: 0.80
  # p_value_threshold DIHAPUS: tidak pernah dibaca kode manapun, dan nilainya (0.01)
  # bertentangan dengan hyphy.p_value_threshold (0.1) yang kini benar-benar dipakai.
  # Ambang signifikansi seleksi hanya didefinisikan di blok `hyphy`.
  group_by: "genotype"

# [M08] PrimerLab Integration (Isothermal RAA Design)
primerlab:
  repo_path: "git+https://github.com/CORE-Lab-Research/primerlab-genomic.git@main"
  template: "config/primerlab_template_cy5.yaml"
  design:
    num_candidates: 1000
    search_strategy: "standard"
    hard_qc_filter: "false"
    max_search_iterations: 5
    vienna_ranking_limit: 500
    window_size: null
    overlap: 200
    validate: true
    blast_offtarget_check: false
    blast_ranking_limit: 10
    blast_database: "nt"
    blast_mode: "remote"
    blast_local_db_path: null
    blast_targeted_check: false
    blast_targeted_db_path: null
    entropy_threshold: 0.50
    assay_type: "RT-RAA"
    reaction_temperature: 39.0
    primer_size:
      min: 30
      opt: 32
      max: 35
    product_size_range: [[150, 300]]
    degenerate:
      enabled: true
      max_iupac_variants: 16

# [M09] BLAST Specificity Verification
blast:
  mode: "remote"                  # "remote" (NCBI cloud) atau "local"
  database: "nt"
  max_target_seqs: 100
  evalue: 1000
  word_size: 7
  dust: "no"
  perc_identity: 70.0
  offtarget:
    human_taxid: 9606
    veto_on_human_match: true
    min_mismatches_human_3prime: 2

# [M10] In-Silico PCR & Verification
insilico_pcr:
  enabled: true
  assay_chemistry: "raa"          # raa | pcr
  max_mismatches: 3
  search_target: "N"
  min_amplicon_len: 120
  max_amplicon_len: 350
  temporal_binning: "year"
  regional_binning: "country"
  # RAA isothermal amplification binding parameters
  raa_3prime_bp: 4            # Jumlah bp ujung 3' yang dianggap kritis (recombinase extension).
                              # JUSTIFIKASI: Higgins et al. 2022, J Mol Diagn 24(11):1207-1216
                              # (doi:10.1016/j.jmoldx.2022.08.005) mendefinisikan "anchor region"
                              # RPA sebagai pre-ante-penultimate s/d terminal 3' = 4 nt terakhir,
                              # dan menemukan mismatch tunggal DI LUAR posisi terminal tidak
                              # berdampak signifikan pada time-to-positivity. Nilai 8 sebelumnya
                              # tidak punya sumber dan membebankan posisi 5-8 ke kuota ketat,
                              # sehingga coverage dilaporkan terlalu rendah.
  raa_max_3prime_mm: 1        # Maks mismatch yang ditoleransi di region 3' kritis
  raa_max_internal_mm: 4      # Maks mismatch yang ditoleransi di region internal (5')
  raa_probe_max_mm: 5         # Maks TOTAL mismatch probe-target. Probe TIDAK dinilai dengan
                              # kinetika 3' seperti primer: ujungnya diblok (C3-spacer) sehingga
                              # tidak bisa diperpanjang polimerase. TwistAmp manual 2.7:
                              # performa RPA tak terpengaruh 5-9 mismatch pada primer & probe.

multiplex:
  # --- CANDIDATE SELECTION (M11) ---
  # Gerbang dulu, baru pengurutan. Kriteria yang membuat asai SALAH menggugurkan
  # kandidat dan tidak pernah ditukar dengan kriteria yang membuatnya sekadar
  # KURANG BAIK. Lihat scripts/tools/candidate_selection.py.
  #
  # Gerbang KELAS 1 tidak ada di sini karena tidak pernah dilonggarkan: amplikon
  # off-target di DNA manusia, off-target ke virus lain, situs ikat manusia dengan
  # ujung 3' terjangkar penuh, tabrakan kanal fluorofor, dan cross-dimer di bawah
  # veto. Semuanya menguji MEKANISME, bukan skor -- skor spesifisitas bersifat
  # akumulatif sehingga satu situs katastrofik dan dua puluh yang remeh
  # menghasilkan grade yang sama.
  #
  # Tangga di bawah hanya melonggarkan gerbang KELAS 2. Seleksi berhenti di
  # tingkat pertama yang menghasilkan kandidat, dan laporan menyebutkan tingkat
  # mana yang dipakai. Hasil nol karena itu mustahil kecuali semua kandidat
  # melanggar kelas 1 -- dan itu memang informasi penting, bukan kegagalan.
  # Batas jumlah kombinasi yang dievaluasi M11. Survivor gerbang per-kandidat
  # dipangkas menurut coverage lalu spesifisitas kalau hasil kalinya melebihi ini.
  # Pairwise jarang menyentuhnya; kasus triplex yang kubik yang membutuhkannya.
  combination_budget: 50000
  selection:
    levels:
      - name: L0
        label: "target profile"
        max_grade: B          # grade spesifisitas manusia terburuk yang diterima
        min_coverage: 95.0    # lantai coverage RAA absolut (%)
        coverage_within: null # toleransi relatif thd coverage terbaik (poin persen)
        allow_warning: false  # boleh merekomendasikan pair berstatus WARNING?
      - name: L1
        label: "coverage judged relative to the best achievable"
        max_grade: B
        min_coverage: 95.0
        coverage_within: 2.0
        allow_warning: false
      - name: L2
        label: "absolute coverage floor lowered to 90%"
        max_grade: B
        min_coverage: 90.0
        coverage_within: 2.0
        allow_warning: false
      - name: L3
        label: "specificity floor lowered to grade C"
        max_grade: C
        min_coverage: 90.0
        coverage_within: 2.0
        allow_warning: false
      - name: L4
        label: "multiplex WARNING accepted"
        max_grade: C
        min_coverage: 85.0
        coverage_within: 5.0
        allow_warning: true
      - name: L5
        label: "LAST RESORT - every quality floor waived; only the non-negotiable safety gates were applied"
        max_grade: null
        min_coverage: null
        coverage_within: null
        allow_warning: true
        last_resort: true
