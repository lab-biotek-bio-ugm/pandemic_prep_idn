# =============================================================================
# Pandemic Preparedness Diagnostic Pipeline — Main Configuration
# =============================================================================

# 1. Target Identity
build_name: "sars-cov-2-trial"

# 2. Database Provider
# Options: "ncbi" or "local"
# - "ncbi"  : Automatic download via NCBI Datasets CLI (Warning: Under Testing)
# - "local" : Manual input — place your files in data/local/
database: "local"

# 3a. Data Acquisition — NCBI Datasets API (used when database = "ncbi")
ncbi_query:
  organism: "SARS-CoV-2"
  location: "Indonesia"
  released_after: "2024-10-01"   # Perkecil rentang tanggal untuk testing cepat

# 3b. Data Acquisition — Local Files (used when database = "local")
# Place your manually downloaded files in data/local/ directory.
# Supported sources: NCBI Virus web portal, GISAID bulk download, etc.
local_input:
  sequences: "data/local/sequences.fasta"
  metadata: "data/local/metadata.csv"
  format: "auto"   # Options: auto | ncbi_virus_csv | gisaid_tsv | gisaid_raw | tsv
                    #   auto          — detect format from column headers (recommended)
                    #   ncbi_virus_csv — NCBI Virus CSV download (Accession, Collection_Date...)
                    #   gisaid_tsv    — GISAID Nextstrain-preprocessed TSV (strain, gisaid_epi_isl...)
                    #   gisaid_raw    — GISAID raw download (Virus name, Accession ID...)
                    #   tsv           — Generic TSV with at least 'strain' and 'date' columns

# 4. Quality Control Prefilter (M2 — qc_prefilter)
qc:
  max_n_content: 5.0              # Max percentage of ambiguous 'N' bases allowed
  dedup: true                     # Remove identical sequences (MD5 hash)

# 4a. Spatio-Temporal Filter (M2 — augur filter)
subsampling:
  group_by: "year month"
  sequences_per_group: 10
  max_sequences: 100
  min_length: 29000              # Minimum sequence length to keep (bp)

# 4b. Timetree Parameters (M4 — augur refine)
# Clock rate varies by virus. Adjust when switching targets.
# ┌───────────────────────────────────────────────────┐
# │ Virus              │ clock_rate │ clock_std_dev   │
# ├───────────────────────────────────────────────────┤
# │ SARS-CoV-2         │ 0.0008     │ 0.0004          │
# │ Influenza A (HA)   │ 0.004      │ 0.002           │
# │ Influenza A (NA)   │ 0.003      │ 0.0015          │
# │ Influenza B        │ 0.002      │ 0.001           │
# │ RSV                │ 0.0006     │ 0.0003          │
# │ Nipah              │ 0.0004     │ 0.0002          │
# └───────────────────────────────────────────────────┘
timetree:
  clock_rate: 0.0008
  clock_std_dev: 0.0004

# 5. File References
references:
  genome: "config/references/sars_cov_2_reference.fasta"
  annotation: "config/references/sars_cov_2_annotation.gff"
  reference_id: "MN908947"  # Accession of the reference in the MSA (without version suffix)

# 6. Nextclade — Clade/Lineage Classification & QC
# Dataset name for Nextclade CLI. To see all available datasets, run:
#   nextclade dataset list --only-names
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ Respiratory Virus Datasets (Quick Reference)                          │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ SARS-CoV-2:  "nextstrain/sars-cov-2/wuhan-hu-1/orfs"                 │
# │              or shortcut: "sars-cov-2"                                │
# │ Influenza A/H1N1pdm: "nextstrain/flu/h1n1pdm/ha/MW626062"            │
# │ Influenza A/H3N2:    "nextstrain/flu/h3n2/ha/EPI1857216"             │
# │ Influenza B/Vic:     "nextstrain/flu/vic/ha/KX058884"                │
# │ Influenza B/Yam:     "nextstrain/flu/yam/ha/JN993010"                │
# │ RSV-A:               "nextstrain/rsv/a/EPI_ISL_412866"               │
# │ RSV-B:               "nextstrain/rsv/b/EPI_ISL_1653999"              │
# │ hMPV:                "nextstrain/hmpv/all/AF371337"                  │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Tip: You can also run `nextclade dataset list --only-names` in your
#      conda environment to get the full up-to-date list.
nextclade:
  dataset_name: "nextstrain/sars-cov-2/wuhan-hu-1/orfs"

# 7. Evolutionary Selection Pressure Engine (M5 — HyPhy)
hyphy:
  p_value_threshold: 0.1
  methods:
    - "FUBAR"
    - "MEME"
    - "GARD"   # Recombination breakpoint detection (critical for Coronaviruses)
  target_genes:
    - "S"
    - "N"
    - "E"
    - "M"
