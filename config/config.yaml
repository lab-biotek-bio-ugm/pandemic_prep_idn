# =============================================================================
# Pandemic Preparedness Diagnostic Pipeline — Main Configuration
# =============================================================================

# 1. Target Identity
build_name: "sars-cov-2-trial"

# 2. Database Provider
# Options: "ncbi" or "gisaid"
# - "ncbi"  : Public, no credentials needed (default for testing)
# - "gisaid": Requires credentials. Set GISAID_USERNAME and GISAID_PASSWORD
#             as environment variables, or provide gisaid_credentials below.
database: "ncbi"

# 3a. Data Acquisition — NCBI Datasets API (used when database = "ncbi")
ncbi_query:
  organism: "SARS-CoV-2"
  location: "Indonesia"
  released_after: "2023-01-01"
  min_length: 29000
  download_limit: 150      # Limit jumlah sequence saat download (untuk testing, set kecil)

# 3b. Data Acquisition — GISAID (used when database = "gisaid")
# Requires GISAID EpiCoV Access credentials.
# ⚠️  NEVER commit credentials to git! Use environment variables instead.
gisaid_query:
  # credentials_file: "~/.gisaid_credentials.json"   # optional file-based auth
  # Alternatively set env vars: GISAID_USERNAME, GISAID_PASSWORD
  virus_name: "hCoV-19"
  location: "Asia / Indonesia"
  collection_date_from: "2023-01-01"
  complete_only: true
  host: "Human"

# 4. Spatio-Temporal Filter (M2 — augur filter)
subsampling:
  group_by: "year month"
  sequences_per_group: 10
  max_sequences: 100

# 5. File References
references:
  genome: "config/references/sars_cov_2_reference.fasta"
  annotation: "config/references/sars_cov_2_annotation.gff"

# 6. Nextclade — Clade/Lineage Classification & QC
# Dataset name for Nextclade CLI. To see all available datasets, run:
#   nextclade dataset list --only-names
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ Respiratory Virus Datasets (Quick Reference)                          │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ SARS-CoV-2:  "nextstrain/sars-cov-2/wuhan-hu-1/orfs"                 │
# │              or shortcut: "sars-cov-2"                                │
# │ Influenza A/H1N1pdm: "nextstrain/flu/h1n1pdm/ha/MW626062"            │
# │ Influenza A/H3N2:    "nextstrain/flu/h3n2/ha/EPI1857216"             │
# │ Influenza B/Vic:     "nextstrain/flu/vic/ha/KX058884"                │
# │ Influenza B/Yam:     "nextstrain/flu/yam/ha/JN993010"                │
# │ RSV-A:               "nextstrain/rsv/a/EPI_ISL_412866"               │
# │ RSV-B:               "nextstrain/rsv/b/EPI_ISL_1653999"              │
# │ hMPV:                "nextstrain/hmpv/all/AF371337"                  │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Tip: You can also run `nextclade dataset list --only-names` in your
#      conda environment to get the full up-to-date list.
nextclade:
  dataset_name: "nextstrain/sars-cov-2/wuhan-hu-1/orfs"

# 7. Evolutionary Selection Pressure Engine (M5 — HyPhy)
hyphy:
  p_value_threshold: 0.1
  methods:
    - "FUBAR"
    - "MEME"
