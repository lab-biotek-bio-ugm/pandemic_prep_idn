[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q

# The suite loads pipeline scripts by path and imports helpers from tests/.
# Declaring the search path here makes `from conftest import load_config` work
# and lets the suite run from an IDE without a hand-set PYTHONPATH.
pythonpath = . tests scripts scripts/tools

# Selection is by PATH, not by marker: `pytest tests/contracts/` is what the
# cheap CI job runs. `-m` cannot serve that purpose, because deselection happens
# after collection, and collecting tests/ imports pipeline scripts that need
# pandas, Biopython and primer3. The markers below are documentation, and let a
# developer skip the slow tests locally.
#
# --strict-markers is intentionally not enabled yet; it goes in once every
# existing test carries a marker, so that one unmarked file cannot turn CI red
# for a reason unrelated to the change under review.
markers =
    contract: cross-file agreement check. Needs only pyyaml. Sub-second.
    unit: pure-function test. No subprocess, no external binary.
    smoke: runs a script end-to-end as a subprocess against a synthetic fixture.
    sourcetext: asserts on the literal text of a source file. Legacy; being retired.
    slow: takes more than five seconds.
