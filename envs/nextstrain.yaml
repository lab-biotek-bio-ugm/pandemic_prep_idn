name: pandemic_nextstrain
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Pipeline Orchestrator
  - snakemake >=8.0
  
  # Nextstrain Ecosystem (M1-M4, M6)
  - augur >=24.0.0
  - iqtree >=2.0.0,<3.0.0
  - ncbi-datasets-cli
  - nextclade
  - unzip

  # Python Script Dependencies (M1 sanitize, M2 QC prefilter, enrich)
  - python >=3.10
  - biopython
  - pandas
  - pyyaml
  - openpyxl
  - xlrd
