highlight-style: pygments

format:
  html:
    css: styles.css
    smooth-scroll: true
    link-external-icon: false
    number-sections: false
    toc: true
    toc-location: right
    toc-expand: true
    toc-depth: 3
    theme:
      - cosmo
    mermaid:
      theme: forest
    code-copy: true
    include-after-body:
      - text: |
          <script>
          document.addEventListener("DOMContentLoaded", function() {
            const citations = document.querySelectorAll('a[href^="#ref-"]');
            citations.forEach(a => {
              const refId = a.getAttribute('href');
              if (!window.location.pathname.endsWith('references.html')) {
                a.setAttribute('href', 'references.html' + refId);
              }
            });

            var tables = document.querySelectorAll("main table");
            tables.forEach(function(table) {
              var firstTh = table.querySelector("thead th");
              if (firstTh) {
                var text = firstTh.textContent.trim().toLowerCase();
                if (text.includes("parameter name")) {
                  table.classList.add("parameter-table");
                } else if (text.includes("file role")) {
                  table.classList.add("files-table");
                }
              }
              if (!table.parentNode.classList.contains("table-responsive")) {
                var wrapper = document.createElement("div");
                wrapper.className = "table-responsive";
                table.parentNode.insertBefore(wrapper, table);
                wrapper.appendChild(table);
              }
            });
          });
          </script>

execute:
  freeze: true
  echo: false
