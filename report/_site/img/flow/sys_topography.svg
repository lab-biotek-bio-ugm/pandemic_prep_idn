<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4dabf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228be6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff922b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd7e14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-gray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#495057" font-weight="bold" letter-spacing="1">SYSTEM TOPOGRAPHY &amp; DATA LIFECYCLE</text>

  <!-- SECTION 1: PREPARATION -->
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="12" fill="#adb5bd" font-weight="bold"></text>
  
  <rect x="50" y="90" width="130" height="70" rx="10" fill="url(#grad-gray)" filter="url(#shadow)" stroke="#dee2e6" stroke-width="1" />
  <text x="115" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#343a40" font-weight="bold">SOURCE DATA</text>
  <text x="115" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#868e96">GISAID / NCBI / etc</text>

  <path d="M 180 125 L 210 125" stroke="#ced4da" stroke-width="2" fill="none" marker-end="url(#arrowhead-gray)" />

  <polygon points="210,125 230,90 270,90 290,125 270,160 230,160" fill="#f8f9fa" stroke="#228be6" stroke-width="2.5" filter="url(#shadow)" />
  <text x="250" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#228be6" font-weight="bold">SNAKEMAKE</text>

  <rect x="330" y="90" width="100" height="70" rx="8" fill="white" stroke="#228be6" stroke-width="2" filter="url(#shadow)" />
  <text x="380" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">M01</text>
  <text x="380" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4dabf7">Acquisition</text>

  <rect x="470" y="90" width="110" height="70" rx="8" fill="white" stroke="#228be6" stroke-width="2" filter="url(#shadow)" />
  <text x="525" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">M02</text>
  <text x="525" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4dabf7">Filtration</text>

  <rect x="620" y="90" width="110" height="70" rx="8" fill="white" stroke="#228be6" stroke-width="2" filter="url(#shadow)" />
  <text x="675" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">M03</text>
  <text x="675" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4dabf7">Alignment</text>

  <path d="M 290 125 L 330 125" stroke="#228be6" stroke-width="2" fill="none" marker-end="url(#arrowhead-blue)" />
  <path d="M 430 125 L 470 125" stroke="#adb5bd" stroke-width="2" fill="none" marker-end="url(#arrowhead-gray)" />
  <path d="M 580 125 L 620 125" stroke="#adb5bd" stroke-width="2" fill="none" marker-end="url(#arrowhead-gray)" />

  <!-- CORRECTED ELBOW CONNECTOR: M03 down to M04 Center-Y -->
  <!-- Target M04 Left Center is at X=100, Y=245 + 37.5 = 282.5 -->
  <path d="M 730 125 L 760 125 C 780 125, 780 200, 760 200 L 50 200 L 50 282.5 L 100 282.5" stroke="#ced4da" stroke-width="2" fill="none" marker-end="url(#arrowhead-gray)" />

  <!-- SECTION 2: ANALYSIS -->
  <text x="100" y="225" font-family="Arial, sans-serif" font-size="12" fill="#adb5bd" font-weight="bold"></text>

  <rect x="100" y="245" width="120" height="75" rx="8" fill="white" stroke="#228be6" stroke-width="2" filter="url(#shadow)" />
  <text x="160" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">M04</text>
  <text x="160" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4dabf7">Phylogeny</text>

  <rect x="270" y="245" width="140" height="75" rx="8" fill="white" stroke="#228be6" stroke-width="2" filter="url(#shadow)" />
  <text x="340" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">M05</text>
  <text x="340" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4dabf7">Selection Pressure</text>

  <rect x="440" y="245" width="150" height="75" rx="8" fill="white" stroke="#228be6" stroke-width="2" filter="url(#shadow)" />
  <text x="515" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#212529" font-weight="bold">M06</text>
  <text x="515" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4dabf7">Ancestral &amp;</text>
  <text x="515" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4dabf7">Trait Mapping</text>

  <path d="M 590 282.5 L 630 282.5" stroke="#fd7e14" stroke-width="3" fill="none" marker-end="url(#arrowhead-orange)" />

  <rect x="630" y="240" width="150" height="85" rx="10" fill="url(#grad-orange)" filter="url(#shadow)" />
  <text x="705" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">PRIMERLAB</text>
  <text x="705" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" style="opacity:0.9">Integration Core</text>

  <path d="M 220 282.5 L 270 282.5" stroke="#ced4da" stroke-width="2" fill="none" marker-end="url(#arrowhead-gray)" />
  <path d="M 410 282.5 L 440 282.5" stroke="#ced4da" stroke-width="2" fill="none" marker-end="url(#arrowhead-gray)" />

  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ced4da" font-style="italic">Orchestrated via Snakemake &amp; Isolated Conda Environments</text>

  <defs>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#adb5bd" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#228be6" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fd7e14" />
    </marker>
  </defs>
</svg>
